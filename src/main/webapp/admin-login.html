<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FitTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="admin-login">

    <!-- NAVBAR HEADER -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Fit<span>Track</span> <small style="font-size: 0.7rem; color: #3b82f6; text-transform: uppercase; font-weight: 600; margin-left: 4px;">Admin</small></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">User Login</a>
                <a href="admin-login.html" class="active">Admin Portal</a>
            </nav>
            <button type="button" class="hamburger-btn" id="mobileMenuBtn" aria-label="Toggle Navigation Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- MOBILE NAV DRAWER -->
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <div class="mobile-nav-drawer" id="mobileNavDrawer">
        <a href="index.html">🏠 Home</a>
        <a href="login.html">👤 User Login</a>
        <a href="register.html">📝 Register Account</a>
        <a href="admin-login.html" class="active">🛡️ Admin Portal</a>
    </div>

    <!-- MAIN ADMIN LOGIN CONTENT -->
    <div class="container section" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div class="auth-card" style="width: 100%; max-width: 440px; border-top: 4px solid var(--secondary);">
            
            <div style="text-align: center; margin-bottom: 24px;">
                <span class="user-badge" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); margin-bottom: 8px;">Administrator Portal</span>
                <h2 style="font-size: 1.8rem; color: var(--text-white); margin-top: 4px;">System Admin</h2>
                <p style="color: var(--text-light); font-size: 0.9rem;">Restricted portal for system administrators</p>
            </div>

            <!-- Dynamic Alert Box -->
            <div id="alert-box" class="alert-box hidden"></div>

            <form id="admin-login-form" action="admin-login" method="POST" onsubmit="return validateAdminLoginForm()">
                <div class="form-group">
                    <label for="email">Admin Email <span style="color: var(--danger);">*</span></label>
                    <input type="email" id="email" name="email" placeholder="admin@fitnesstracker.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password <span style="color: var(--danger);">*</span></label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-secondary btn-lg btn-block" style="margin-top: 10px;">Log In as Admin</button>
            </form>

            <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-light);">
                Not an Admin? <a href="login.html" style="color: var(--secondary); font-weight: 600; text-decoration: none;">User Login Portal &rarr;</a>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-container">
            <p>&copy; 2026 FitTrack. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
